<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183d2b" />
    <meta
      name="description"
      content="J&O means Joseph & Owura. Discover our integrated farm in Ankwensu, Ghana: livestock, fish, crops, animal feed, genuine fertilizer and agricultural training."
    />
    <title>J&O Farm Produce | From the ground up.</title>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GH" />
    <meta property="og:site_name" content="J&O Farm Produce" />
    <meta property="og:title" content="J&O Farm Produce | From the ground up." />
    <meta
      property="og:description"
      content="Livestock, fish, crops, animal feed, fertilizer and agricultural training from our integrated farm in Ankwensu, Eastern Region, Ghana."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "J&O Farm Produce Ltd",
        "legalName": "Joseph & Owura Farm Produce Ltd",
        "description": "Integrated farm supplying livestock, fish, crops, animal feed, fertilizer and agro-consultancy across Ghana.",
        "telephone": "+233243503083",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ankwensu",
          "addressRegion": "Eastern Region",
          "addressCountry": "GH"
        },
        "areaServed": "GH",
        "founder": [
          { "@type": "Person", "name": "Joseph Ocloo" },
          { "@type": "Person", "name": "Edward Appiah-Dwomoh", "alternateName": "Owura" }
        ]
      }
    </script>
    <script>
      // The hero intro animates in from hidden. Keep it hidden until the app starts,
      // but show it anyway if the app is slow to load (see usePageMotion).
      if (matchMedia("(prefers-reduced-motion: no-preference)").matches) {
        document.documentElement.classList.add("intro-pending");
        window.introFallback = setTimeout(() => document.documentElement.classList.remove("intro-pending"), 3000);
      }
    </script>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
